<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マトリョーシカ方式①②</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(#f1f7ff,#fbf7ff);color:#243043}.wrap{max-width:760px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.back{text-decoration:none;color:#475467;background:#fff;border:1px solid #e5e9f0;padding:10px 13px;border-radius:12px;font-weight:700}.card{background:#fff;border:1px solid #e5e9f0;border-radius:20px;padding:20px;box-shadow:0 8px 24px rgba(36,48,67,.07);margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.grid{grid-template-columns:1fr}}button{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:800}.primary{background:#5b7cfa;color:#fff}.secondary{background:#eef2ff;color:#4059c7}.warm{background:#f3edff;color:#6e47c7}.ghost{background:#f6f7f9;color:#475467}.danger{background:#fff0f0;color:#b42318}.choice{text-align:left;background:#fff;border:2px solid #e5e9f0;color:#243043;margin:9px 0}.correct{border-color:#1f9d61!important;background:#effaf3!important}.wrong{border-color:#d84b4b!important;background:#fff1f1!important}.badge{display:inline-block;background:#eef2ff;color:#4059c7;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#f7f8fa;border:1px solid #e5e9f0;border-radius:999px;padding:7px 10px;font-size:13px;font-weight:800}.prompt{background:#f8faff;border-left:6px solid #5b7cfa;padding:14px;border-radius:12px;margin:12px 0;line-height:1.7}.q{font-size:20px;line-height:1.7;font-weight:800}.fb{display:none;margin-top:14px;padding:14px;border-radius:14px;line-height:1.65}.good{display:block;background:#effaf3;color:#166534}.bad{display:block;background:#fff1f1;color:#9b1c1c}.next{display:none;margin-top:14px}.hide{display:none!important}.progress{height:9px;background:#edf0f4;border-radius:999px;overflow:hidden;margin:10px 0}.bar{height:100%;background:linear-gradient(90deg,#5b7cfa,#9a6df0)}.note{background:#f7f4ff;border:1px solid #ded2ff;border-radius:14px;padding:13px;line-height:1.7}.small{font-size:13px;color:#667085}
</style></head><body><div class="wrap">
<div class="top"><a class="back" href="index.html">← クエスト一覧</a><b>📖 国語クエスト</b></div>
<section id="home" class="card"><div class="badge">マトリョーシカ方式①②</div><h1>🪆 マトリョーシカ・クエスト</h1><p>大きな意味の中に、より具体的な意味を入れて整理しよう。</p><div class="note"><b>攻略のコツ</b><br>外側ほど広く・抽象的。内側ほどせまく・具体的。語句も文章も同じ考え方で整理できます。</div><p><b>挑戦するコース</b></p><div class="grid"><button class="primary" onclick="start('all')">🎮 全問チャレンジ</button><button class="secondary" onclick="start('word')">① 語句の整理</button><button class="warm" onclick="start('sent')">② 文章の整理</button><button class="ghost" onclick="start('weak')">🔥 苦手だけ復習</button></div><p id="weakInfo" class="small"></p><button class="danger" onclick="resetWeak()">🗑️ 苦手をリセット</button></section>
<section id="game" class="card hide"><div id="badge" class="badge"></div><div class="stats"><span class="pill">問題 <span id="n"></span>/<span id="total"></span></span><span class="pill">正解 <span id="score"></span></span><span class="pill">連続 <span id="streak"></span>🔥</span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="prompt" class="prompt"></div><div id="question" class="q"></div><div id="choices"></div><div id="fb" class="fb"></div><button id="next" class="primary next" onclick="nextQ()">次の問題へ →</button></section>
<section id="end" class="card hide"><div class="badge">RESULT</div><h2>クエスト結果</h2><h1 id="result"></h1><p id="resultSub"></p><div class="grid"><button class="primary" onclick="homeBack()">もう一度</button><button class="ghost" onclick="start('weak')">🔥 苦手だけ復習</button></div></section>
</div><script>
const Q=[
{id:"w1",g:"word",p:"食べ物 → 野菜 → ？",q:"いちばん内側に入る具体例は？",c:["にんじん","果物","料理","植物"],a:0,e:"にんじんは野菜の具体例です。"},
{id:"w2",g:"word",p:"乗り物 → 鉄道 → ？",q:"いちばん内側に入るものは？",c:["新幹線","自動車","交通","道路"],a:0,e:"新幹線は鉄道の一種です。"},
{id:"w3",g:"word",p:"生き物 → 動物 → ？",q:"いちばん内側に入るものは？",c:["イルカ","植物","自然","海"],a:0,e:"イルカは動物なので内側に入ります。"},
{id:"w4",g:"word",p:"文房具 → ？ → シャープペンシル",q:"真ん中に入る言葉は？",c:["筆記用具","教室用品","紙製品","学用品"],a:0,e:"シャープペンシルは筆記用具の一種です。"},
{id:"w5",g:"word",p:"スポーツ → 球技 → ？",q:"いちばん内側に入るものは？",c:["サッカー","運動","競技場","選手"],a:0,e:"サッカーは球技の一種です。"},
{id:"w6",g:"word",p:"建物 → 商業施設 → ？",q:"具体例として適切なのは？",c:["百貨店","住宅","道路","公園"],a:0,e:"百貨店は商業施設の具体例です。"},
{id:"w7",g:"word",p:"自然 → 天気 → ？",q:"いちばん内側に入るものは？",c:["大雨","気候","季節","地形"],a:0,e:"大雨は天気の具体的な現象です。"},
{id:"w8",g:"word",p:"音楽 → 楽器 → ？",q:"具体例として適切なのは？",c:["バイオリン","合唱","演奏会","作曲"],a:0,e:"バイオリンは楽器の具体例です。"},
{id:"w9",g:"word",p:"交通 → ？ → 路線バス",q:"真ん中に入る言葉は？",c:["公共交通","道路標識","観光","運送"],a:0,e:"路線バスは公共交通の一つです。"},
{id:"w10",g:"word",p:"植物 → 花 → ？",q:"いちばん内側に入る具体例は？",c:["チューリップ","森林","草原","種子"],a:0,e:"チューリップは花の具体例です。"},
{id:"s1",g:"sent",p:"毎朝ジョギングをし、休日には水泳もしている。",q:"この文を大きくまとめる表現は？",c:["日ごろから運動をしている。","朝の時間を大切にしている。","休日には外出することが多い。","水泳を中心に体を動かしている。"],a:0,e:"ジョギングと水泳をまとめると「運動をしている」です。"},
{id:"s2",g:"sent",p:"鉛筆、消しゴム、定規を机の上にそろえた。",q:"より大きな内容にまとめると？",c:["必要な文房具を準備した。","机の上をきれいに片づけた。","授業で使う物をすべて買った。","筆記用具だけを机に並べた。"],a:0,e:"具体的な物を「必要な文房具」とまとめています。"},
{id:"s3",g:"sent",p:"雨が降ったので傘をさした。",q:"この文の内容をより広く表すと？",c:["天気に合わせて行動した。","傘を使うことに決めた。","雨の日は外出をやめた。","濡れないよう急いで歩いた。"],a:0,e:"雨だから傘をさすのは、天気に合わせた行動の具体例です。"},
{id:"s4",g:"sent",p:"教室では静かに話し、図書室ではさらに声を小さくする。",q:"大きくまとめると？",c:["場所に合わせて声の大きさを変える。","教室では話さないように気をつける。","図書室では会話をしないようにする。","静かな場所だけで小声を使う。"],a:0,e:"二つの行動を「場所に合わせて声を変える」とまとめられます。"},
{id:"s5",g:"sent",p:"春は桜、夏はひまわり、秋はコスモスが見られる。",q:"より抽象的にまとめると？",c:["季節ごとにさまざまな花が見られる。","一年中同じ花を見ることができる。","春と秋にだけ花が多く咲いている。","花の種類は季節とは関係していない。"],a:0,e:"具体的な花の名前を、季節ごとの花としてまとめています。"},
{id:"s6",g:"sent",p:"宿題を終え、明日の持ち物を確認し、目覚まし時計をセットした。",q:"大きくまとめると？",c:["明日の準備をした。","夜の勉強を終えた。","学校の予定を確認した。","寝る時間を早めることにした。"],a:0,e:"三つの行動をまとめると「明日の準備」です。"},
{id:"s7",g:"sent",p:"話している人の顔を見て、最後まで口をはさまずに聞いた。",q:"より大きな内容にまとめると？",c:["相手の話を丁寧に聞いた。","相手の顔を見ることを心がけた。","話の途中では質問をしなかった。","自分の意見を言わずに聞き続けた。"],a:0,e:"具体的な聞き方を「丁寧に聞く」とまとめています。"},
{id:"s8",g:"sent",p:"使わない照明を消し、紙は両面を使い、水を出しっぱなしにしない。",q:"大きくまとめると？",c:["資源を大切にしている。","電気を使わない生活をしている。","紙や水の使用を禁止している。","家の中の決まりを守っている。"],a:0,e:"電気・紙・水への行動を「資源を大切にする」とまとめられます。"},
{id:"s9",g:"sent",p:"サッカーではパス、野球では送球、バスケットボールではパスを使う。",q:"より抽象的にまとめると？",c:["球技では仲間にボールを渡す動きがある。","スポーツでは必ず手でボールを投げる。","球技では一人でボールを運ぶことが多い。","どの競技でも同じ方法でボールを扱う。"],a:0,e:"競技ごとの具体例を共通する動きとしてまとめています。"},
{id:"s10",g:"sent",p:"理由を述べ、そのあと具体例を挙げ、最後に結論をまとめた。",q:"この行動を大きくまとめると？",c:["文章の組み立てを考えた。","具体例だけを詳しく説明した。","理由と結論を同じ文にまとめた。","書く前に言葉の意味を調べた。"],a:0,e:"複数の作業を「文章の組み立て」とまとめられます。"}];
const KEY="kokugo_matryoshka_weak";let order=[],pos=0,sc=0,st=0,ans=false,current=[];
const $=id=>document.getElementById(id);const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}};const save=a=>localStorage.setItem(KEY,JSON.stringify([...new Set(a)]));const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function info(){let x=load().length;$("weakInfo").textContent=x?`苦手問題は ${x} 問あります。`:"現在、苦手問題の記録はありません。"}function resetWeak(){localStorage.removeItem(KEY);info();alert("苦手記録をリセットしました。")}
function start(m){let p=m==="word"?Q.filter(x=>x.g==="word"):m==="sent"?Q.filter(x=>x.g==="sent"):m==="weak"?Q.filter(x=>load().includes(x.id)):Q;if(m==="weak"&&!p.length){alert("苦手問題はまだありません。");return}order=shuffle(p);pos=0;sc=0;st=0;$("home").classList.add("hide");$("end").classList.add("hide");$("game").classList.remove("hide");show()}
function show(){ans=false;let q=order[pos];$("badge").textContent=q.g==="word"?"① 語句の整理":"② 文章の整理";$("n").textContent=pos+1;$("total").textContent=order.length;$("score").textContent=sc;$("streak").textContent=st;$("bar").style.width=`${pos/order.length*100}%`;$("prompt").textContent=q.p;$("question").textContent=q.q;$("choices").innerHTML="";current=shuffle(q.c.map((x,i)=>({text:x,ok:i===q.a})));current.forEach((x,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=x.text;b.onclick=()=>answer(i,b);$("choices").appendChild(b)});$("fb").className="fb";$("next").style.display="none"}
function answer(i,b){if(ans)return;ans=true;let q=order[pos],bs=[...document.querySelectorAll(".choice")];bs.forEach((x,j)=>{x.disabled=true;if(current[j].ok)x.classList.add("correct")});let w=load();if(current[i].ok){sc++;st++;save(w.filter(x=>x!==q.id));$("fb").className="fb good";$("fb").innerHTML="✅ 正解！<br>"+q.e}else{st=0;if(!w.includes(q.id))w.push(q.id);save(w);b.classList.add("wrong");$("fb").className="fb bad";$("fb").innerHTML="❌ おしい！<br>"+q.e}$("score").textContent=sc;$("streak").textContent=st;$("next").style.display="block";info()}
function nextQ(){pos++;if(pos>=order.length){finish()}else show()}function finish(){$("game").classList.add("hide");$("end").classList.remove("hide");let pct=Math.round(sc/order.length*100);$("result").textContent=`${sc} / ${order.length}`;$("resultSub").textContent=pct===100?"完全クリア！マトリョーシカ名人！":pct>=80?"かなり整理できています。苦手だけ復習して仕上げよう！":pct>=60?"あと一歩。外側と内側の関係を意識しよう！":"広い意味→具体的な意味の順をもう一度確認しよう！"}function homeBack(){$("end").classList.add("hide");$("home").classList.remove("hide");info()}info();
</script></body></html>
