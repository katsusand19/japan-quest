<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f2">
  <title>社会QUEST｜地理編 v7.1 第4章追加版</title>
  <link rel="stylesheet" href="style-v71.css">
</head>
<body>
  <main id="app" class="app-shell">
    <header class="site-header">
      <div>
        <p class="eyebrow">社会メモリーチェック × 読解トレーニング</p>
        <h1>社会QUEST</h1>
      </div>
      <button id="resetProgressBtn" class="ghost small">進捗リセット</button>
    </header>

    <section id="homeView">
      <div class="hero card">
        <h2>読む → 根拠 → 整理 → 思い出す</h2>
        <p>「声に出して読めた」ではなく、「何が書いてあるか分かった」を目指します。</p>
      </div>

      <div class="chapter-grid">
        <button class="chapter-card card" data-chapter="1">
          <div class="chapter-top">
            <span class="chapter-no">第1章</span>
            <span id="progress1" class="progress-pill">0%</span>
          </div>
          <h3>日本列島</h3>
          <p>基本データ／東西南北端／領土／標準時／海流／大陸棚／周辺国／距離・時差</p>
          <span class="start-label">はじめる →</span>
        </button>

        <button class="chapter-card card" data-chapter="2">
          <div class="chapter-top">
            <span class="chapter-no">第2章</span>
            <span id="progress2" class="progress-pill">0%</span>
          </div>
          <h3>海岸線と湾・半島</h3>
          <p>リアス海岸／砂浜海岸／砂嘴・砂州／四大島／半島／湾／地名／記述</p>
          <span class="start-label">はじめる →</span>
        </button>

        <button class="chapter-card card" data-chapter="3">
          <div class="chapter-top">
            <span class="chapter-no">第3章</span>
            <span id="progress3" class="progress-pill">0%</span>
          </div>
          <h3>山地・山脈と湖・川</h3>
          <p>割合／日本アルプス／フォッサマグナ／湖／日本三急流／川の地図／記述</p>
          <span class="start-label">網羅版を試す →</span>
        </button>

        <button class="chapter-card card" data-chapter="4">
          <div class="chapter-top"><span class="chapter-no">第4章</span><span id="progress4" class="progress-pill">0%</span></div>
          <h3>平野・台地・盆地</h3>
          <p>扇状地／三角州／台地／盆地／平野と川／地図問題／輪中の記述</p>
          <span class="start-label">網羅版を試す →</span>
        </button>
      </div>

      <div class="rules card subtle">
        <b>この版で反映したこと</b>
        <p>選択肢は毎回ランダム。教材に地図がある問題は地図を使用。地図で場所を選ぶ連続問題は、同じ地図を画面内に固定したまま問題文だけ切り替わります。</p>
      </div>
    </section>

    <section id="gameView" class="hidden">
      <div class="game-head">
        <button id="homeBtn" class="ghost">← 章選択</button>
        <div class="game-title-wrap">
          <div id="chapterLabel" class="eyebrow"></div>
          <h2 id="stepTitle"></h2>
        </div>
      </div>

      <div class="progress-row">
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        <span id="stepCounter"></span>
      </div>

      <section class="card lesson-card">
        <div id="stage"></div>
        <div id="feedback" class="feedback hidden" aria-live="polite"></div>
        <button id="nextBtn" class="primary full hidden">次へ</button>
      </section>
    </section>

    <section id="noteView" class="hidden">
      <div class="card">
        <p class="eyebrow">まとめノート</p>
        <h2 id="noteTitle"></h2>
        <p class="muted">紙のノートに書き写してから、見ないで章ボスに挑戦しよう。</p>
        <div id="noteBody" class="note-sheet"></div>
        <button id="toBossBtn" class="primary full">✏️ 書き写した！ 章ボスへ</button>
      </div>
    </section>

    <section id="bossView" class="hidden">
      <div class="card">
        <div class="boss-head">
          <div class="boss-icon">👑</div>
          <div>
            <p class="eyebrow">FINAL</p>
            <h2 id="bossTitle"></h2>
          </div>
        </div>
        <div id="bossStage"></div>
        <div id="bossFeedback" class="feedback hidden"></div>
      </div>
    </section>
  </main>

  <script src="script-v71.js"></script>
</body>
</html>
