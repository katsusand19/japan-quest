<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f2">
  <title>社会QUEST｜地理編</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" class="app-shell">
    <header class="site-header">
      <div>
        <p class="eyebrow">社会メモリーチェック × 地理 × 読解トレーニング</p>
        <h1>社会QUEST</h1>
      </div>
      <button id="resetProgressBtn" class="ghost small">進捗リセット</button>
    </header>

    <section id="homeView">
      <div class="hero card">
        <h2>読む → 根拠 → 整理 → 思い出す</h2>
        <p>「声に出して読めた」ではなく、「何が書いてあるか分かった」を目指します。</p>
      </div>

      <div class="chapter-toolbar card subtle">
        <div><b>地理編 全36章</b><div class="muted">国土 → 地形・気候 → 人口 → 農林水産業 → 工業 → 資源・貿易 → 地方別</div></div>
        <select id="groupFilter" aria-label="分野を選ぶ">
          <option value="all">すべて</option>
          <option value="国土・地形">国土・地形</option>
          <option value="気候・人口">気候・人口</option>
          <option value="農業">農業</option>
          <option value="水産業">水産業</option>
          <option value="工業">工業</option>
          <option value="資源・貿易">資源・貿易</option>
          <option value="地方別">地方別</option>
        </select>
      </div>
      <div id="chapterGrid" class="chapter-grid"></div>

      <div class="rules card subtle">
        <b>この版で反映したこと</b>
        <p>選択肢は毎回ランダム。誤答は同じ単元の紛らわしい語を優先。対応問題で間違えると、その欄に赤枠と「←ここを見直そう」が付きます。</p>
      </div>
    </section>

    <section id="gameView" class="hidden">
      <div class="game-head">
        <button id="homeBtn" class="ghost">← 章選択</button>
        <div class="game-title-wrap">
          <div id="chapterLabel" class="eyebrow"></div>
          <h2 id="stepTitle"></h2>
        </div>
      </div>

      <div class="progress-row">
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        <span id="stepCounter"></span>
      </div>

      <section class="card lesson-card">
        <div id="stage"></div>
        <div id="feedback" class="feedback hidden" aria-live="polite"></div>
        <button id="nextBtn" class="primary full hidden">次へ</button>
      </section>
    </section>

    <section id="noteView" class="hidden">
      <div class="card">
        <p class="eyebrow">まとめノート</p>
        <h2 id="noteTitle"></h2>
        <p class="muted">紙のノートに書き写してから、見ないで章ボスに挑戦しよう。</p>
        <div id="noteBody" class="note-sheet"></div>
        <button id="toBossBtn" class="primary full">✏️ 書き写した！ 章ボスへ</button>
      </div>
    </section>

    <section id="bossView" class="hidden">
      <div class="card">
        <div class="boss-head">
          <div class="boss-icon">👑</div>
          <div>
            <p class="eyebrow">FINAL</p>
            <h2 id="bossTitle"></h2>
          </div>
        </div>
        <div id="bossStage"></div>
        <div id="bossFeedback" class="feedback hidden"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
