<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>花のつくりクエスト</title>
<style>
:root{
  --bg:#f7fbff; --card:#ffffff; --ink:#17324d; --sub:#6c7f90;
  --accent:#4aa3ff; --accent2:#ff7aa8; --good:#2fb36f; --bad:#e35b5b;
  --gold:#f3b43f;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  background:linear-gradient(180deg,#eef8ff,#fffaf3);color:var(--ink);
}
.wrap{max-width:820px;margin:0 auto;padding:18px 14px 32px}
h1{font-size:28px;margin:6px 0 2px}
.sub{color:var(--sub);font-size:14px}
.card{
  background:var(--card);border-radius:22px;padding:18px;margin-top:14px;
  box-shadow:0 10px 28px rgba(49,93,131,.10);border:1px solid #e8f0f6;
}
.topbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:#f5f9fc;border-radius:14px;padding:10px;text-align:center;font-weight:700}
.stat small{display:block;color:var(--sub);font-weight:500;font-size:11px}
.progress{height:12px;background:#eaf0f5;border-radius:999px;overflow:hidden;margin:12px 0 2px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--accent),#7dd3fc);width:0%;transition:.25s}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:#eef7ff;color:#2877b8;font-weight:700;font-size:12px}
.question{font-size:23px;line-height:1.45;margin:14px 0 16px;font-weight:800}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{
  appearance:none;border:none;border-radius:16px;padding:14px 12px;font-size:17px;font-weight:800;
  background:#f0f6fb;color:var(--ink);box-shadow:inset 0 0 0 1px #dbe8f2;
}
button:active{transform:scale(.98)}
button.choice:hover{background:#e8f4ff}
button.primary{background:linear-gradient(90deg,var(--accent),#76c7ff);color:white;box-shadow:none}
button.secondary{background:#fff4f7;color:#a83d69}
button.good{background:#e8f8ef;color:#137542;box-shadow:inset 0 0 0 2px #7dd6a2}
button.bad{background:#fff0f0;color:#a63d3d;box-shadow:inset 0 0 0 2px #f0a0a0}
.feedback{min-height:58px;margin-top:12px;padding:12px 14px;border-radius:14px;background:#f8fafc;display:none}
.feedback.show{display:block}
.feedback strong{font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.start-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.note{font-size:13px;color:var(--sub);line-height:1.6}
.hidden{display:none}
.flowerbox{display:flex;justify-content:center;margin:8px 0 4px}
svg{max-width:320px;width:100%;height:auto}
.label{font-size:12px;fill:#17324d;font-weight:700}
.endbig{font-size:34px;text-align:center;margin:8px 0}
.wronglist{margin:8px 0 0;padding-left:20px}
hr{border:none;border-top:1px solid #edf1f5;margin:16px 0}
.smallbtn{font-size:13px;padding:9px 10px;border-radius:12px}
@media (max-width:560px){
  .answers,.start-grid{grid-template-columns:1fr}
  .question{font-size:20px}
  h1{font-size:25px}
}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="badge">中学受験 理科</div>
    <h1>🌸 花のつくりクエスト</h1>
    <div class="sub">「花のつくり」「虫媒花・風媒花」をゲーム感覚で復習！</div>
  </div>

  <section id="start" class="card">
    <h2 style="margin-top:0">コースをえらぼう</h2>
    <div class="start-grid">
      <button class="primary" onclick="startGame('mix')">🎮 ミックス 10問</button>
      <button onclick="startGame('parts')">🌼 花のつくり</button>
      <button onclick="startGame('pollination')">🐝 虫媒花・風媒花</button>
      <button onclick="startGame('review')">🔥 苦手だけ復習</button>
    </div>
    <p class="note">
      間違えた問題はこの端末に記録され、「苦手だけ復習」で出やすくなります。<br>
      正解 +10点、3連続正解からコンボボーナス！
    </p>
    <div class="row">
      <button class="smallbtn secondary" onclick="resetWeak()">苦手記録をリセット</button>
    </div>
  </section>

  <section id="game" class="card hidden">
    <div class="topbar">
      <div class="stat"><small>スコア</small><span id="score">0</span></div>
      <div class="stat"><small>連続正解</small><span id="combo">0</span></div>
      <div class="stat"><small>問題</small><span id="qnum">1/10</span></div>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div id="tag" class="badge" style="margin-top:12px">花のつくり</div>
    <div id="visual"></div>
    <div id="question" class="question"></div>
    <div id="answers" class="answers"></div>
    <div id="feedback" class="feedback"></div>
    <div class="row" style="justify-content:flex-end;margin-top:10px">
      <button id="nextBtn" class="primary hidden" onclick="nextQuestion()">次へ ▶</button>
    </div>
  </section>

  <section id="end" class="card hidden">
    <div class="endbig" id="rankEmoji">🌷</div>
    <h2 id="endTitle" style="text-align:center">おつかれさま！</h2>
    <p id="endText" style="text-align:center"></p>
    <div id="endWrong"></div>
    <div class="start-grid">
      <button class="primary" onclick="startGame('review')">🔥 間違いだけ再挑戦</button>
      <button onclick="backHome()">🏠 コース選択へ</button>
    </div>
  </section>
</div>

<script>
const Q = [
  {cat:'parts',tag:'花のつくり',q:'めしべの先の、花粉がつく部分を何といいますか？',
   a:['柱頭','子房','やく','がく'],ok:0,exp:'めしべの先端は「柱頭」。ここに花粉がつくと受粉です。'},
  {cat:'parts',tag:'花のつくり',q:'めしべの根元にあり、受粉のあとに実になる部分は？',
   a:['花びら','子房','柱頭','おしべ'],ok:1,exp:'子房は受粉後に成長して実になります。'},
  {cat:'parts',tag:'花のつくり',q:'おしべの先にあり、花粉がつくられる部分は？',
   a:['柱頭','がく','やく','子房'],ok:2,exp:'おしべの先の「やく」で花粉がつくられます。'},
  {cat:'parts',tag:'花のつくり',q:'柱頭に花粉がつくことを何といいますか？',
   a:['発芽','受粉','結実','蒸散'],ok:1,exp:'柱頭に花粉がつくことを「受粉」といいます。'},
  {cat:'parts',tag:'花のつくり',q:'受粉のあと、子房は何になりますか？',
   a:['実','種子','花粉','花びら'],ok:0,exp:'子房は実になります。'},
  {cat:'parts',tag:'花のつくり',q:'受粉のあと、子房の中にある「胚珠」は何になりますか？',
   a:['実','種子','やく','がく'],ok:1,exp:'胚珠は種子になります。'},
  {cat:'parts',tag:'花のつくり',q:'花がつぼみのときに花を包み、花が咲いたあと花全体を支える部分は？',
   a:['花びら','がく','柱頭','やく'],ok:1,exp:'「がく」はつぼみを守り、開花後は花を支えます。'},
  {cat:'parts',tag:'タンポポ',q:'タンポポの種子が飛ぶとき、綿毛になる部分は何ですか？',
   a:['冠毛','柱頭','花びら','胚珠'],ok:0,exp:'タンポポの綿毛になる部分は「冠毛（かんもう）」です。'},
  {cat:'parts',tag:'タンポポ',q:'タンポポの花は、どのようなつくりですか？',
   a:['1つの大きな花だけ','小さな花が集まってできている','花びらがない','必ず1枚の花びらだけ'],ok:1,exp:'タンポポは小さな花がたくさん集まって1つの花のように見えます。'},

  {cat:'pollination',tag:'虫媒花',q:'こん虫によって花粉が運ばれる花を何といいますか？',
   a:['風媒花','虫媒花','裸子植物','単子葉類'],ok:1,exp:'こん虫が花粉を運ぶ花は「虫媒花」です。'},
  {cat:'pollination',tag:'風媒花',q:'風によって花粉が運ばれる花を何といいますか？',
   a:['虫媒花','風媒花','離弁花','合弁花'],ok:1,exp:'風が花粉を運ぶ花は「風媒花」です。'},
  {cat:'pollination',tag:'特徴',q:'花びらが目立ち、においやみつでこん虫を引きよせることが多いのは？',
   a:['虫媒花','風媒花'],ok:0,exp:'こん虫を呼ぶため、虫媒花は花びら・におい・みつが目立つものが多いです。'},
  {cat:'pollination',tag:'特徴',q:'花びらをもたず、においを出さないものが多いのは？',
   a:['虫媒花','風媒花'],ok:1,exp:'風媒花はこん虫を呼ぶ必要がないため、花びらやにおいが目立たないものが多いです。'},
  {cat:'pollination',tag:'花粉',q:'べとべとしていたり、とげのような突起がついていたりする花粉が多いのは？',
   a:['虫媒花','風媒花'],ok:0,exp:'虫の体につきやすくするため、虫媒花の花粉には粘りや突起があるものがあります。'},
  {cat:'pollination',tag:'花粉',q:'軽くて小さい花粉が多いのは？',
   a:['虫媒花','風媒花'],ok:1,exp:'風に乗りやすいように、風媒花の花粉は軽く小さいものが多いです。'},
  {cat:'pollination',tag:'花粉の量',q:'大量の花粉をつくる必要があるのは？',
   a:['虫媒花','風媒花'],ok:1,exp:'風ではどこに飛ぶかわからないため、風媒花は大量の花粉をつくります。'},
  {cat:'pollination',tag:'植物',q:'次のうち、虫媒花はどれ？',
   a:['アブラナ','スギ','マツ','イネ'],ok:0,exp:'アブラナは虫媒花。スギ・マツ・イネは風媒花です。'},
  {cat:'pollination',tag:'植物',q:'次のうち、風媒花はどれ？',
   a:['エンドウ','タンポポ','カボチャ','トウモロコシ'],ok:3,exp:'トウモロコシは風媒花。ほかは虫媒花です。'},
  {cat:'pollination',tag:'植物',q:'次の組み合わせで、どちらも風媒花なのは？',
   a:['マツとスギ','アブラナとイネ','エンドウとヒマワリ','カボチャとタンポポ'],ok:0,exp:'マツとスギはどちらも風媒花です。'},
  {cat:'pollination',tag:'植物',q:'次の組み合わせで、どちらも虫媒花なのは？',
   a:['スギとイネ','マツとトウモロコシ','アブラナとタンポポ','スギとカボチャ'],ok:2,exp:'アブラナとタンポポはどちらも虫媒花です。'}
];

let gameQs=[], idx=0, score=0, combo=0, wrongIds=[], answered=false;

function getWeak(){
  try{return JSON.parse(localStorage.getItem('flowerWeak')||'{}')}catch(e){return {}}
}
function saveWeak(id,delta){
  let w=getWeak(); w[id]=Math.max(0,(w[id]||0)+delta);
  localStorage.setItem('flowerWeak',JSON.stringify(w));
}
function shuffle(arr){ return [...arr].sort(()=>Math.random()-.5); }

function startGame(mode){
  document.getElementById('start').classList.add('hidden');
  document.getElementById('end').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  idx=0;score=0;combo=0;wrongIds=[];
  let ids=Q.map((_,i)=>i);

  if(mode==='parts') ids=ids.filter(i=>Q[i].cat==='parts');
  else if(mode==='pollination') ids=ids.filter(i=>Q[i].cat==='pollination');
  else if(mode==='review'){
    const w=getWeak();
    const weak=ids.filter(i=>(w[i]||0)>0);
    if(weak.length){
      let weighted=[];
      weak.forEach(i=>{for(let n=0;n<Math.min(4,w[i]);n++)weighted.push(i)});
      ids=shuffle(weighted).slice(0,10);
    } else {
      ids=shuffle(ids).slice(0,10);
    }
  } else {
    ids=shuffle(ids).slice(0,10);
  }
  gameQs=ids;
  render();
}

function render(){
  answered=false;
  document.getElementById('nextBtn').classList.add('hidden');
  const f=document.getElementById('feedback'); f.className='feedback'; f.innerHTML='';
  document.getElementById('score').textContent=score;
  document.getElementById('combo').textContent=combo;
  document.getElementById('qnum').textContent=(idx+1)+'/'+gameQs.length;
  document.getElementById('bar').style.width=(idx/gameQs.length*100)+'%';

  const id=gameQs[idx], q=Q[id];
  document.getElementById('tag').textContent=q.tag;
  document.getElementById('question').textContent=q.q;
  document.getElementById('visual').innerHTML = (q.cat==='parts' && idx%3===0) ? flowerSvg() : '';

  const a=document.getElementById('answers'); a.innerHTML='';
  q.a.forEach((txt,i)=>{
    const b=document.createElement('button');
    b.className='choice'; b.textContent=txt;
    b.onclick=()=>answer(i,b);
    a.appendChild(b);
  });
}

function answer(choice,btn){
  if(answered)return;
  answered=true;
  const id=gameQs[idx], q=Q[id];
  const buttons=[...document.querySelectorAll('.choice')];
  buttons[q.ok].classList.add('good');
  let fb=document.getElementById('feedback');
  if(choice===q.ok){
    combo++;
    const bonus=combo>=3 ? 5 : 0;
    score += 10+bonus;
    saveWeak(id,-1);
    fb.innerHTML='<strong>⭕ 正解！</strong>'+(bonus? ' コンボ +5点！':'')+'<br>'+q.exp;
  }else{
    btn.classList.add('bad');
    combo=0; wrongIds.push(id); saveWeak(id,1);
    fb.innerHTML='<strong>❌ おしい！</strong><br>'+q.exp;
  }
  fb.classList.add('show');
  document.getElementById('score').textContent=score;
  document.getElementById('combo').textContent=combo;
  document.getElementById('nextBtn').classList.remove('hidden');
}

function nextQuestion(){
  idx++;
  if(idx>=gameQs.length) finish();
  else render();
}

function finish(){
  document.getElementById('game').classList.add('hidden');
  document.getElementById('end').classList.remove('hidden');
  const max=gameQs.length*10;
  let rate=score/max;
  let emoji='🌱', title='もう一回でぐんと伸びる！';
  if(rate>=.9){emoji='👑';title='植物マスター！'}
  else if(rate>=.7){emoji='🌷';title='花の博士まであと少し！'}
  document.getElementById('rankEmoji').textContent=emoji;
  document.getElementById('endTitle').textContent=title;
  document.getElementById('endText').textContent='スコア '+score+'点 ／ 基本点 '+max+'点（コンボボーナスあり）';

  const box=document.getElementById('endWrong');
  const uniq=[...new Set(wrongIds)];
  if(!uniq.length){
    box.innerHTML='<div class="feedback show"><strong>🎉 全問正解！</strong><br>苦手記録も少しずつ減っています。</div>';
  }else{
    box.innerHTML='<hr><strong>今回の復習ポイント</strong><ul class="wronglist">'+
      uniq.map(i=>'<li>'+Q[i].q+'<br><span class="note">'+Q[i].exp+'</span></li>').join('')+'</ul>';
  }
}

function backHome(){
  document.getElementById('end').classList.add('hidden');
  document.getElementById('game').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');
}

function resetWeak(){
  localStorage.removeItem('flowerWeak');
  alert('苦手記録をリセットしました。');
}

function flowerSvg(){
  return `
  <div class="flowerbox">
  <svg viewBox="0 0 320 210" aria-label="花の模式図">
    <ellipse cx="95" cy="90" rx="58" ry="32" fill="#ffdbe8" transform="rotate(-25 95 90)"/>
    <ellipse cx="225" cy="90" rx="58" ry="32" fill="#ffdbe8" transform="rotate(25 225 90)"/>
    <ellipse cx="125" cy="48" rx="48" ry="27" fill="#ffe6ef" transform="rotate(18 125 48)"/>
    <ellipse cx="195" cy="48" rx="48" ry="27" fill="#ffe6ef" transform="rotate(-18 195 48)"/>
    <path d="M160 55 L160 155" stroke="#4b7d4a" stroke-width="7"/>
    <ellipse cx="160" cy="53" rx="15" ry="9" fill="#f4c75a"/>
    <path d="M145 155 Q160 175 175 155 Z" fill="#7bc67b"/>
    <line x1="125" y1="80" x2="115" y2="145" stroke="#577a46" stroke-width="4"/>
    <ellipse cx="123" cy="78" rx="9" ry="5" fill="#f0b44f"/>
    <line x1="195" y1="80" x2="205" y2="145" stroke="#577a46" stroke-width="4"/>
    <ellipse cx="197" cy="78" rx="9" ry="5" fill="#f0b44f"/>
    <line x1="105" y1="103" x2="95" y2="145" stroke="#577a46" stroke-width="4"/>
    <ellipse cx="104" cy="101" rx="9" ry="5" fill="#f0b44f"/>
    <line x1="215" y1="103" x2="225" y2="145" stroke="#577a46" stroke-width="4"/>
    <ellipse cx="216" cy="101" rx="9" ry="5" fill="#f0b44f"/>
    <text x="176" y="54" class="label">柱頭</text>
    <text x="180" y="164" class="label">子房</text>
    <text x="227" y="83" class="label">やく</text>
  </svg>
  </div>`;
}
</script>
</body>
</html>
